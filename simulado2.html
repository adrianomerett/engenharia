<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simulado 2 — Engenharia de Software</title>
<style>
:root{
  --bg:#f4f7fb; --card:#fff; --text:#182230; --muted:#667085;
  --primary:#2563eb; --primary2:#1d4ed8; --ok:#15803d; --bad:#b91c1c;
  --okbg:#ecfdf3; --badbg:#fef2f2; --border:#dbe2ea;
}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.55}
.container{max-width:920px;margin:0 auto;padding:28px 16px 50px}
header,.card,.result{background:var(--card);border:1px solid var(--border);border-radius:18px;box-shadow:0 6px 24px rgba(16,24,40,.06)}
header{padding:24px;margin-bottom:18px}
h1{margin:0 0 6px;font-size:28px}
.subtitle{color:var(--muted);margin:0}
.topbar{display:flex;justify-content:space-between;gap:12px;align-items:center;margin:18px 0 8px;font-weight:700}
.progress{height:10px;background:#e8edf3;border-radius:99px;overflow:hidden}
.progress>div{height:100%;background:var(--primary);width:0;transition:.25s}
.card{padding:24px;display:none}
.card.active{display:block}
.badge{display:inline-block;background:#eff6ff;color:#1d4ed8;padding:5px 10px;border-radius:999px;font-size:13px;font-weight:700;margin-bottom:12px}
h2{font-size:20px;margin:0 0 20px}
.options{display:grid;gap:10px}
.option{border:1px solid var(--border);border-radius:12px;padding:13px 14px;cursor:pointer;background:#fff;transition:.15s}
.option:hover{border-color:#93c5fd;background:#f8fbff}
.option.selected{border-color:var(--primary);background:#eff6ff}
.option.correct{border-color:var(--ok);background:var(--okbg)}
.option.wrong{border-color:var(--bad);background:var(--badbg)}
.option input{margin-right:10px}
.feedback{margin-top:18px;padding:14px;border-radius:12px;display:none}
.feedback.show{display:block}
.feedback.ok{background:var(--okbg);color:#166534}
.feedback.bad{background:var(--badbg);color:#991b1b}
.actions{display:flex;justify-content:space-between;gap:10px;margin-top:20px}
button{border:0;border-radius:11px;padding:12px 17px;font-size:15px;font-weight:700;cursor:pointer}
.btn-check{background:var(--primary);color:#fff}
.btn-check:hover{background:var(--primary2)}
.btn-next{background:#111827;color:#fff}
.btn-secondary{background:#e5e7eb;color:#111827}
button:disabled{opacity:.5;cursor:not-allowed}
.result{display:none;padding:26px}
.result.show{display:block}
.score{font-size:46px;font-weight:800;margin:8px 0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}
.stat{background:#f8fafc;border:1px solid var(--border);border-radius:12px;padding:14px;text-align:center}
.stat b{display:block;font-size:23px}
.topic{margin:10px 0}
.topic-head{display:flex;justify-content:space-between;font-size:14px}
.mini{height:8px;background:#e8edf3;border-radius:99px;overflow:hidden;margin-top:5px}
.mini>div{height:100%;background:var(--primary)}
.note{font-size:13px;color:var(--muted);margin-top:18px}
@media(max-width:600px){.stats{grid-template-columns:1fr}.actions{flex-direction:column}.actions button{width:100%}}
</style>
</head>
<body>
<div class="container">
<header>
  <h1>Simulado 2 — Engenharia de Software</h1>
  <p class="subtitle">20 questões inéditas, elaboradas a partir dos temas dos materiais fornecidos e complementadas com conhecimentos de Engenharia de Software.</p>
  <div class="topbar"><span id="progressText">Questão 1 de 20</span><span id="scoreText">Acertos: 0</span></div>
  <div class="progress"><div id="progressBar"></div></div>
</header>

<div id="quiz"></div>
<div id="result" class="result"></div>
</div>

<script>
const questions = [
{topic:"Requisitos",q:"Uma equipe está levantando requisitos para um sistema de biblioteca. O cliente exige que a busca por livros responda em no máximo 2 segundos. Como esse requisito deve ser classificado?",a:["Funcional, pois descreve uma busca","Não funcional, pois estabelece uma característica de desempenho","De domínio, pois representa uma regra da biblioteca","De implementação, pois define a linguagem","De interface, pois trata da tela de busca"],c:1,e:"O limite de tempo de resposta descreve uma característica de qualidade/desempenho, portanto é um requisito não funcional."},
{topic:"Requisitos",q:"Durante a elicitação, o analista acompanha os funcionários enquanto eles realizam suas tarefas no ambiente real de trabalho. Qual técnica está sendo utilizada?",a:["Entrevista","Questionário","Etnografia/observação","JAD","Prototipação"],c:2,e:"A observação ou etnografia busca compreender o trabalho acompanhando as atividades no ambiente em que elas ocorrem."},
{topic:"Requisitos",q:"Em um sistema acadêmico, a regra 'um aluno somente poderá ser aprovado se sua média final for igual ou superior a 7' é melhor representada como:",a:["Requisito funcional genérico","Requisito não funcional de usabilidade","Regra de negócio/requisito de domínio","Requisito de hardware","Requisito de interface"],c:2,e:"Requisitos de domínio são associados às regras de negócio do contexto em que o sistema será utilizado."},
{topic:"Processo",q:"Uma equipe percebe que as atividades do projeto estão sendo executadas sem uma ordem definida. Qual elemento da Engenharia de Software deve ser estruturado para estabelecer as etapas e o encadeamento das atividades?",a:["Processo de desenvolvimento","Banco de dados","Sistema operacional","Protótipo de interface","Controle de versão"],c:0,e:"A camada de processo determina as etapas de desenvolvimento e o fluxo/encadeamento das atividades."},
{topic:"Modelos de Processo",q:"Uma empresa pretende entregar pequenas partes funcionais do produto em várias versões, permitindo que o cliente receba valor antes da conclusão de todo o sistema. Qual abordagem combina melhor com esse cenário?",a:["Modelo em cascata estritamente sequencial","Modelo incremental","Modelo exclusivamente documental","Modelo sem planejamento","Modelo de manutenção corretiva"],c:1,e:"No modelo incremental, o produto pode ser disponibilizado em incrementos, cada um acrescentando parte das funcionalidades."},
{topic:"Modelos de Processo",q:"Em um projeto no qual os riscos técnicos são elevados e precisam ser analisados repetidamente durante o desenvolvimento, qual característica torna o modelo espiral particularmente apropriado?",a:["Eliminação de qualquer iteração","Ênfase na análise contínua de riscos","Ausência de avaliação do cliente","Execução obrigatoriamente linear","Impossibilidade de criar protótipos"],c:1,e:"O modelo espiral combina desenvolvimento iterativo com uma forte ênfase na identificação e análise de riscos."},
{topic:"Prototipação",q:"Uma equipe cria uma versão simplificada de uma tela para que usuários possam experimentar o fluxo e apontar problemas antes da implementação completa. Qual é a principal finalidade dessa atividade?",a:["Substituir definitivamente os testes","Validar e esclarecer requisitos","Eliminar a necessidade de documentação","Controlar versões do código","Realizar auditoria financeira"],c:1,e:"A prototipação é especialmente útil para tornar requisitos mais concretos e obter feedback dos usuários antes da implementação completa."},
{topic:"Ágil",q:"Um cliente altera uma necessidade importante no meio do desenvolvimento. Em uma abordagem ágil, qual princípio é mais diretamente relacionado à capacidade de responder a essa mudança?",a:["Adaptação contínua ao contexto e ao feedback","Proibição de alterações após o planejamento","Execução de todas as fases sem retorno","Dependência exclusiva de documentação extensa","Bloqueio da participação do cliente"],c:0,e:"Métodos ágeis valorizam adaptação, feedback frequente e capacidade de responder às mudanças."},
{topic:"Scrum",q:"No Scrum, o Product Owner precisa esclarecer quais itens do produto representam maior valor para o negócio. Qual responsabilidade está mais relacionada a essa situação?",a:["Manter e comunicar a visão do produto e prioridades","Executar todos os testes unitários","Administrar servidores de produção","Escrever todo o código sozinho","Substituir o time de desenvolvimento"],c:0,e:"O Product Owner representa a perspectiva do produto e trabalha com requisitos, prioridades e valor para as partes interessadas."},
{topic:"Scrum",q:"Uma equipe Scrum percebe que um obstáculo externo está impedindo o avanço das atividades. Qual papel tem, entre suas responsabilidades, facilitar a remoção de impedimentos e apoiar o cumprimento das regras do Scrum?",a:["Product Owner","Usuário final","Scrum Master","Analista de banco de dados","Cliente externo"],c:2,e:"O Scrum Master atua como facilitador e ajuda a equipe a compreender e aplicar o framework, inclusive auxiliando na resolução de impedimentos."},
{topic:"XP",q:"Em XP, uma equipe decide escrever primeiro um teste unitário que descreve o comportamento esperado e só depois implementar o código necessário para fazê-lo passar. Qual prática está sendo aplicada?",a:["Test-first/TDD","Big bang integration","Deploy manual","Auditoria de configuração","Etnografia"],c:0,e:"A prática test-first consiste em escrever o teste antes da implementação do código correspondente."},
{topic:"Desenvolvimento",q:"Um sistema já possui os modelos e especificações necessários, e a equipe passa a transformar essas especificações em código executável. Em qual etapa isso ocorre principalmente?",a:["Elicitação","Implementação","Levantamento de domínio","Auditoria de configuração","Encerramento do projeto"],c:1,e:"A implementação é a etapa em que as especificações/projetos são transformados em software executável."},
{topic:"Testes",q:"Após uma alteração em um módulo, a equipe executa novamente testes de funcionalidades antigas para verificar se a mudança não provocou efeitos indesejados. Qual objetivo está sendo atendido?",a:["Teste de recuperação","Teste de regressão","Teste de segurança física","Teste de disponibilização","Teste de aceitação formal"],c:1,e:"O teste de regressão verifica se alterações ou correções não quebraram comportamentos que anteriormente funcionavam."},
{topic:"Testes",q:"Um sistema precisa ser avaliado em diferentes combinações de sistemas operacionais, navegadores e configurações de hardware previstas para os usuários. Qual tipo de teste é mais adequado?",a:["Teste de recuperação","Teste unitário","Teste de disponibilização/configuração","Teste de caixa-branca","Teste de integração de código"],c:2,e:"O teste de disponibilização/configuração verifica o comportamento do software em diferentes ambientes e configurações previstas."},
{topic:"Testes",q:"Um sistema de vendas funciona corretamente com poucos usuários, mas apresenta tempos de resposta muito altos quando a quantidade de acessos aumenta até o pico previsto. Qual aspecto deve ser investigado principalmente?",a:["Desempenho","Regra de negócio","Controle de versão","Modelagem de classes","Elicitação"],c:0,e:"Testes de desempenho avaliam se o comportamento do sistema, especialmente resposta e capacidade sob condições previstas, atende aos requisitos."},
{topic:"Qualidade",q:"Uma equipe de qualidade cria procedimentos e padrões organizacionais para orientar a produção de software com qualidade. Essa atividade corresponde principalmente à:",a:["Garantia da qualidade","Codificação","Implantação física","Gerência de memória","Elicitação"],c:0,e:"A garantia da qualidade estabelece procedimentos e padrões organizacionais para apoiar a produção de software com qualidade."},
{topic:"Qualidade",q:"Um software é considerado adequado quanto à facilidade de uso quando um novo usuário consegue aprender e operar suas funções com pouco esforço. Qual atributo de qualidade está diretamente relacionado?",a:["Portabilidade","Usabilidade","Confiabilidade","Eficiência","Controle de mudanças"],c:1,e:"Usabilidade está associada à facilidade de uso e à interação do usuário com o software."},
{topic:"Gerenciamento de Configuração",q:"Uma equipe precisa garantir que alterações em arquivos do projeto sejam registradas, que versões anteriores possam ser recuperadas e que diferentes desenvolvedores trabalhem sobre os mesmos artefatos de forma controlada. Qual recurso atende diretamente a esse objetivo?",a:["Sistema de controle de versões","Editor de imagens","Compilador isolado","Questionário de requisitos","Protótipo descartável"],c:0,e:"Sistemas de controle de versões registram a evolução dos artefatos e ajudam a equipe a trabalhar com diferentes versões de forma controlada."},
{topic:"Gerenciamento de Configuração",q:"Durante uma auditoria, a equipe verifica se os itens de configuração estão identificados, se as mudanças foram autorizadas e se o estado registrado corresponde ao que deveria ter sido entregue. Qual atividade de GCS está sendo realizada?",a:["Auditoria de configuração","Elicitação","Prototipação","Teste unitário","Planejamento de sprint"],c:0,e:"A auditoria de configuração verifica a conformidade dos itens e mudanças com o que foi estabelecido no gerenciamento de configuração."},
{topic:"Gerenciamento de Configuração",q:"Uma equipe deseja gerar uma nova versão do sistema sem perder a possibilidade de recuperar uma versão anterior e precisa manter rastreabilidade das alterações. Qual conjunto de atividades é mais diretamente relacionado a essa necessidade?",a:["Controle de versões e controle de mudanças","Somente testes de desempenho","Somente entrevistas","Somente modelagem de negócio","Apenas implantação"],c:0,e:"Controle de versões mantém diferentes estados dos artefatos, enquanto o controle de mudanças organiza e acompanha as alterações realizadas."}
];

let current=0, score=0, answered=false, answers=[];

const quiz=document.getElementById("quiz");
const result=document.getElementById("result");
const progressBar=document.getElementById("progressBar");
const progressText=document.getElementById("progressText");
const scoreText=document.getElementById("scoreText");

function render(){
  quiz.innerHTML="";
  questions.forEach((item,i)=>{
    const card=document.createElement("section");
    card.className="card"+(i===0?" active":"");
    card.id="q"+i;
    card.innerHTML=`
      <div class="badge">${item.topic}</div>
      <h2>${i+1}. ${item.q}</h2>
      <div class="options">
        ${item.a.map((x,j)=>`<label class="option" data-i="${j}">
          <input type="radio" name="q${i}" value="${j}"> <b>${String.fromCharCode(65+j)})</b> ${x}
        </label>`).join("")}
      </div>
      <div class="feedback" id="fb${i}"></div>
      <div class="actions">
        <button class="btn-check" onclick="check(${i})">✓ Verificar resposta</button>
        <button class="btn-next" id="next${i}" onclick="next(${i})" disabled>${i===questions.length-1?"Ver resultado":"Próxima questão →"}</button>
      </div>`;
    quiz.appendChild(card);
    card.querySelectorAll(".option").forEach(el=>{
      el.addEventListener("click",()=>{
        if(answered && i===current) return;
        card.querySelectorAll(".option").forEach(o=>o.classList.remove("selected"));
        el.classList.add("selected");
        el.querySelector("input").checked=true;
      });
    });
  });
  update();
}
function update(){
  progressText.textContent=`Questão ${current+1} de ${questions.length}`;
  scoreText.textContent=`Acertos: ${score}`;
  progressBar.style.width=((current+1)/questions.length*100)+"%";
}
function check(i){
  if(i!==current) return;
  const card=document.getElementById("q"+i);
  const selected=card.querySelector('input[type="radio"]:checked');
  const fb=document.getElementById("fb"+i);
  if(!selected){alert("Selecione uma alternativa antes de verificar.");return;}
  const val=Number(selected.value);
  const correct=questions[i].c;
  answers[i]=val;
  answered=true;
  card.querySelectorAll(".option").forEach((o,j)=>{
    o.style.pointerEvents="none";
    if(j===correct)o.classList.add("correct");
    if(j===val && val!==correct)o.classList.add("wrong");
  });
  if(val===correct){
    score++;
    fb.className="feedback show ok";
    fb.innerHTML="<b>✓ Correto!</b> "+questions[i].e;
  }else{
    fb.className="feedback show bad";
    fb.innerHTML="<b>✗ Incorreto.</b> A resposta correta é <b>"+String.fromCharCode(65+correct)+") "+questions[i].a[correct]+"</b>.<br>"+questions[i].e;
  }
  card.querySelector(".btn-check").disabled=true;
  document.getElementById("next"+i).disabled=false;
  scoreText.textContent=`Acertos: ${score}`;
}
function next(i){
  if(i!==current || !answered)return;
  document.getElementById("q"+i).classList.remove("active");
  if(i===questions.length-1){showResult();return;}
  current++;
  answered=false;
  document.getElementById("q"+current).classList.add("active");
  update();
  window.scrollTo({top:0,behavior:"smooth"});
}
function showResult(){
  quiz.style.display="none";
  result.classList.add("show");
  const pct=Math.round(score/questions.length*100);
  const grade=(score/questions.length*10).toFixed(1);
  const topics={};
  questions.forEach((q,i)=>{
    if(!topics[q.topic])topics[q.topic]={n:0,c:0};
    topics[q.topic].n++;
    if(answers[i]===q.c)topics[q.topic].c++;
  });
  let bars="";
  Object.entries(topics).forEach(([t,v])=>{
    const p=Math.round(v.c/v.n*100);
    bars+=`<div class="topic"><div class="topic-head"><span>${t}</span><b>${v.c}/${v.n}</b></div><div class="mini"><div style="width:${p}%"></div></div></div>`;
  });
  let msg=pct>=90?"Excelente desempenho!":pct>=70?"Bom desempenho.":pct>=50?"Desempenho intermediário — vale revisar os temas com menor aproveitamento.":"Recomenda-se revisar os conteúdos e tentar novamente.";
  result.innerHTML=`
    <h2>Resultado final</h2>
    <div class="score">${grade}/10</div>
    <p><b>${msg}</b></p>
    <div class="stats">
      <div class="stat"><b>${score}</b>Acertos</div>
      <div class="stat"><b>${questions.length-score}</b>Erros</div>
      <div class="stat"><b>${pct}%</b>Aproveitamento</div>
    </div>
    <h3>Desempenho por tema</h3>${bars}
    <p class="note">As questões deste simulado foram elaboradas de forma inédita: os materiais serviram como base conceitual, mas os enunciados não foram copiados das questões dos arquivos.</p>
    <button class="btn-secondary" onclick="restart()">↻ Refazer simulado</button>`;
  window.scrollTo({top:0,behavior:"smooth"});
}
function restart(){
  current=0;score=0;answered=false;answers=[];
  result.classList.remove("show");quiz.style.display="block";
  render();window.scrollTo({top:0,behavior:"smooth"});
}
render();
</script>
</body>
</html>
